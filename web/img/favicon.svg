<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <radialGradient id="bg" cx="35%" cy="25%">
            <stop offset="0%" stop-color="#8f4cff"></stop>
            <stop offset="55%" stop-color="#35106f"></stop>
            <stop offset="100%" stop-color="#050507"></stop>
        </radialGradient>

        <linearGradient id="n" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff4bb5"></stop>
            <stop offset="50%" stop-color="#a85cff"></stop>
            <stop offset="100%" stop-color="#24d8ff"></stop>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="blur"></feGaussianBlur>
            <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
        </filter>
    </defs>

    <!-- Space -->
    <rect width="100" height="100" rx="24" fill="#030306"></rect>

    <!-- Galaxy glow -->
    <circle cx="50" cy="50" r="39" fill="url(#bg)"></circle>

    <!-- Orbit -->
    <ellipse cx="50" cy="50" rx="40" ry="17" fill="none" stroke="#9b5cff" stroke-width="2" opacity=".65" transform="rotate(-20 50 50)"></ellipse>

    <!-- Planet -->
    <circle cx="50" cy="50" r="25" fill="url(#n)" filter="url(#glow)"></circle>

    <!-- N -->
    <path d="M37 66V34L63 66V34" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>

    <!-- Stars -->
    <circle cx="18" cy="25" r="1.5" fill="white"></circle>
    <circle cx="80" cy="22" r="1" fill="#24d8ff"></circle>
    <circle cx="78" cy="78" r="1.5" fill="white"></circle>
</svg>